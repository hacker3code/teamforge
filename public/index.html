<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--chalk:#F2F4F8;--paper:#fff;--ink:#161A33;--ink2:#555B7A;--line:#DADEEA;--signal:#3547F5;--signal-d:#2433C4;--amber:#F2A93B;--moss:#14906F;--coral:#D9484A;--r:14px}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--chalk);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.08;margin:0;letter-spacing:-.025em;font-weight:700}
h1{font-size:clamp(2.1rem,5vw,3.4rem)} h2{font-size:1.5rem} h3{font-size:1.1rem;letter-spacing:-.01em}
p{margin:0} a{color:var(--signal)}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;z-index:50}.skip:focus{left:8px}
.muted{color:var(--ink2)} .small{font-size:.875rem}
/* header */
header.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font:700 1.25rem "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.brand svg{width:22px;height:26px}
nav.tabs{display:flex;gap:4px;margin-left:12px}
nav.tabs a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:.95rem}
nav.tabs a[aria-current=page]{background:var(--ink);color:#fff}
.who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:.9rem}
/* layout */
main{max-width:1120px;margin:0 auto;padding:32px 20px 80px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.panel.pad{padding:22px}
.side{display:grid;gap:20px;position:sticky;top:88px}
/* seats: the one memorable element */
.seats{display:inline-flex;gap:6px;align-items:flex-end}
.seat{width:20px;height:24px;border-radius:8px 8px 4px 4px;background:var(--ink)}
.seat.open{background:transparent;border:2px dashed #AEB4CC}
.seat.last{border:2px dashed var(--amber);background:rgba(242,169,59,.25);animation:breathe 2.2s ease-in-out infinite}
.seat.over{background:var(--coral)}
.seats.big .seat{width:34px;height:42px;border-radius:13px 13px 6px 6px}.seats.big{gap:10px}
@keyframes breathe{50%{background:rgba(242,169,59,.55)}}
/* board */
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:20px;align-items:center;padding:18px 22px}
.row+.row{border-top:1px solid var(--line)}
.row h3{margin-bottom:2px}
.seatcol{display:grid;gap:4px;justify-items:start;min-width:112px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:.8rem;font-weight:500;padding:2px 10px;border-radius:999px;background:#E9ECF6;color:#2B3157}
.chip.want{background:#FFF1D6;color:#7A4B00}
/* forms + buttons */
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password],select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{border-color:var(--signal);outline:none;box-shadow:0 0 0 3px rgba(53,71,245,.18)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{margin:0;font-weight:500}
.checks input{position:absolute;opacity:0}
.checks span{display:inline-block;padding:6px 13px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;font-size:.9rem;user-select:none}
.checks input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.checks input:focus-visible+span{outline:3px solid var(--signal);outline-offset:2px}
.btn{font:600 .95rem Figtree,sans-serif;border:0;border-radius:10px;padding:10px 18px;background:var(--signal);color:#fff;cursor:pointer;min-height:42px}
.btn:hover{background:var(--signal-d)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:var(--ink);background:#fff}
.btn.danger{background:transparent;color:var(--coral);border:1.5px solid #F1C4C5}.btn.danger:hover{background:#FDF0F0}
.btn.small{padding:6px 12px;min-height:34px;font-size:.85rem}
.btn:disabled{opacity:.55;cursor:wait}
.field-row{display:flex;gap:10px}.field-row input{flex:1}
/* auth */
.auth{max-width:1000px;margin:0 auto;padding:56px 20px;display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center;min-height:100vh}
.auth .lede{margin:18px 0 28px;font-size:1.15rem;color:var(--ink2);max-width:30em}
.auth .seats{margin-bottom:22px}
.switch{margin-top:16px;font-size:.9rem}.switch button{background:none;border:0;color:var(--signal);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
/* team page */
.stack{display:grid;gap:24px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:14px 0;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.list li+li{border-top:1px solid var(--line)}
.role{font-size:.78rem;font-weight:600;color:var(--signal);margin-left:8px}
.code{font:600 1.15rem ui-monospace,Consolas,monospace;background:#F2F4F8;border-radius:10px;padding:10px 14px;word-break:break-all;display:block;margin:10px 0}
.bar2{height:6px;border-radius:99px;background:#E9ECF6;overflow:hidden;margin-top:3px}.bar2 i{display:block;height:100%;background:var(--signal)}
.bars{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.8rem;color:var(--ink2);min-width:200px;align-items:center}
.score{font:700 1.4rem "Bricolage Grotesque",sans-serif;min-width:3.2ch}
.tl li{display:block;padding:9px 0;font-size:.92rem}
.empty{padding:36px 22px;color:var(--ink2)}
.empty strong{display:block;color:var(--ink);font:700 1.15rem "Bricolage Grotesque",sans-serif;margin-bottom:4px}
/* arena */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:18px 0}
.dot{aspect-ratio:1;border-radius:6px;background:#E3E6F1;animation:pop .35s both}
.dot.win{background:var(--moss)} .dot.lose{background:#C9CEE0}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.verdict{font-weight:600;margin-top:12px}.verdict.bad{color:var(--coral)}.verdict.good{color:var(--moss)}
.checklist{list-style:none;margin:12px 0 0;padding:0}.checklist li{padding:6px 0;display:flex;justify-content:space-between;gap:12px}
.ok{color:var(--moss);font-weight:600}.no{color:var(--coral);font-weight:600}
/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,420px)}
.t{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:500;box-shadow:0 8px 28px rgba(22,26,51,.3)}.t.err{background:var(--coral)}
@media(max-width:860px){
  .cols,.duo,.auth{grid-template-columns:1fr}.side{position:static}.auth{gap:28px;padding-top:32px;min-height:0}
  .row{grid-template-columns:1fr auto}.row .seatcol{order:3;grid-column:1/-1}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--paper);border-top:1px solid var(--line);justify-content:space-around;padding:8px;z-index:30}
  nav.tabs a{flex:1;text-align:center}.who span{display:none}main{padding-bottom:110px}#toast{bottom:84px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.mt1{margin-top:8px}.mt2{margin-top:16px}.mt3{margin-top:22px}.mb2{margin-bottom:16px}.wide{width:100%}.grow{flex:1;min-width:180px}.measure{max-width:42em}
.h1s{font-size:2rem}.nomb{margin:0}.duo2{display:flex;gap:8px}.linkbtn{text-decoration:none;display:inline-block}.loading{padding:60px 20px;text-align:center}
.eyebrow{font:600 .8rem Figtree,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--signal);margin-bottom:14px}
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:34px;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;margin-bottom:32px}
.hero h1{color:#fff;font-size:clamp(1.8rem,4vw,2.7rem);max-width:15em}.hero p{color:#C4C9E4;margin-top:12px;max-width:34em}
.stats{display:flex;gap:34px}.stat{text-align:right}
.stat b{display:block;font:700 2.8rem "Bricolage Grotesque",sans-serif;line-height:1;color:var(--amber)}.stat span{font-size:.85rem;color:#C4C9E4}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:20px;font-size:.85rem;color:#C4C9E4}
.legend .i{display:inline-flex;align-items:center;gap:8px}.legend .seat{width:14px;height:17px;border-radius:6px 6px 3px 3px}
.hero .seat{background:#fff}.hero .seat.open{background:transparent;border-color:#7F86AE}.hero .seat.last{border-color:var(--amber);background:rgba(242,169,59,.35)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:30px 0 0;padding:0;list-style:none}
.steps li{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:.88rem;color:var(--ink2)}
.steps b{display:block;color:var(--ink);font:700 1rem "Bricolage Grotesque",sans-serif;margin-bottom:2px}
.bar2{display:block}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding:24px}.stat{text-align:left}.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div id="root"></div>
<noscript>TeamForge needs JavaScript.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect, useCallback } = React;
const html = htm.bind(React.createElement); // React components written with tagged templates, so no build step is needed
const SKILLS = ["frontend", "backend", "design", "ml", "devops", "mobile", "product"];
const REASONS = {
  full: "That team is full.", code_expired: "This invite code has expired. Ask the leader for a new one.",
  invalid_code: "No team uses that code.", already_in_team: "You are already on a team. Leave it first.",
  already_requested: "You already asked this team.", not_leader: "Only the team leader can do that.",
  rate_limited: "Too many tries. Wait a minute and try again.", bad_credentials: "Email or password is wrong.",
  email_taken: "That email already has an account.", invalid_input: "Some fields are not valid. Check the form.",
  applicant_unavailable: "That person joined another team.", already_decided: "That request was already handled.",
  in_progress: "Your last click is still being processed. Try again in a moment.", unauthorized: "Please sign in again.",
  not_member: "That person is not on the team.", team_closed: "That team is closed to new members.",
  too_small: "The team is below its minimum size, so it cannot be finalized yet.",
};
const say = (r) => REASONS[r.reason] || "Something went wrong. Try again.";
let pushToast = () => {};
const toast = (m, err) => pushToast(m, err);

async function api(path, { method = "GET", body } = {}) {
  const headers = {}, token = localStorage.getItem("tf_token");
  if (body) headers["content-type"] = "application/json";
  if (token) headers.authorization = "Bearer " + token;
  if (method !== "GET") headers["idempotency-key"] = crypto.randomUUID(); // a double click or retry can never act twice
  let res, data = {};
  try { res = await fetch("/api" + path, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
  catch { return { ok: false, reason: "network" }; }
  try { data = await res.json(); } catch {}
  if (res.status === 401 && token && !path.startsWith("/login")) window.dispatchEvent(new Event("tf-logout"));
  return { status: res.status, ...data };
}
const ago = (t) => { const s = (Date.now() - new Date(t)) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + " min ago" : s < 86400 ? Math.floor(s / 3600) + " h ago" : Math.floor(s / 86400) + " d ago"; };
const until = (t) => { const m = Math.round((new Date(t) - Date.now()) / 60000); return m <= 0 ? "expired" : m < 60 ? `expires in ${m} min` : `expires in ${Math.round(m / 60)} h`; };

function useHash() {
  const [h, setH] = useState(location.hash || "#/board");
  useEffect(() => { const f = () => setH(location.hash || "#/board"); addEventListener("hashchange", f); return () => removeEventListener("hashchange", f); }, []);
  return h;
}
function useLoad(fn, deps) {
  const [data, setData] = useState(null);
  useEffect(() => { let live = true; fn().then((d) => live && setData(d)); return () => { live = false; }; }, deps);
  return data;
}
async function act(call, okMsg, refresh) {
  const r = await call();
  if (!r.ok) { toast(say(r), true); return r; }
  toast(okMsg); await refresh(); return r;
}

/* ---------- small components ---------- */
function Seats({ n, max, big }) {
  const items = [];
  for (let i = 0; i < Math.max(n, max); i++) {
    const c = i >= max ? "over" : i < n ? "" : i === max - 1 && n === max - 1 ? "open last" : "open";
    items.push(html`<span key=${i} class=${"seat " + c}></span>`);
  }
  return html`<span class=${"seats" + (big ? " big" : "")} role="img" aria-label=${`${n} of ${max} seats taken`}>${items}</span>`;
}
const Chips = ({ items, want }) => items?.length ? html`<div class="chips">${items.map((s) => html`<span key=${s} class=${"chip" + (want ? " want" : "")}>${s}</span>`)}</div>` : null;
const Checks = ({ name }) => html`<div class="checks">${SKILLS.map((s) => html`<label key=${s}><input type="checkbox" name=${name} value=${s} /><span>${s}</span></label>`)}</div>`;
const Chair = () => html`<svg viewBox="0 0 22 26" aria-hidden="true"><rect x="2" y="1" width="18" height="24" rx="8" ry="8" fill="#3547F5"/><rect x="2" y="17" width="18" height="8" rx="3" fill="#161A33"/></svg>`;

/* ---------- sign in / register ---------- */
function Auth({ onLogin }) {
  const [reg, setReg] = useState(false), [busy, setBusy] = useState(false);
  const off = -new Date().getTimezoneOffset();
  async function submit(e) {
    e.preventDefault(); const d = new FormData(e.target); setBusy(true);
    const r = reg
      ? await api("/register", { method: "POST", body: { name: d.get("name"), email: d.get("email"), password: d.get("password"), skills: d.getAll("skills"), utcOffsetMinutes: off } })
      : await api("/login", { method: "POST", body: { email: d.get("email"), password: d.get("password") } });
    setBusy(false); r.ok ? onLogin(r.token) : toast(say(r), true);
  }
  async function demo() {
    setBusy(true);
    const r = await api("/login", { method: "POST", body: { email: "user6000@seed.dev", password: "password123" } });
    setBusy(false); r.ok ? onLogin(r.token) : toast("Demo data is not loaded on this server. Create an account instead.", true);
  }
  return html`<div class="auth">
    <section>
      <p class="eyebrow">Hackathon team formation</p>
      <h1>Find your team. Never double-book a seat.</h1>
      <p class="lede">Teams have a fixed number of seats. Browse teams that still have room, ask to join, or use an invite code. When many people click the last seat at once, exactly one gets it.</p>
      <${Seats} n=${3} max=${4} big=${true} />
      <ol class="steps">
        <li><b>1. Pick a team</b>Browse open seats or start your own.</li>
        <li><b>2. Watch it live</b>Seats fill in real time, no refresh.</li>
        <li><b>3. Never overbooked</b>Try the Race Arena to see it proven.</li>
      </ol>
    </section>
    <section class="panel pad" aria-labelledby="ah">
      <h2 id="ah">${reg ? "Create your account" : "Sign in"}</h2>
      <form key=${reg ? "r" : "l"} onSubmit=${submit} noValidate>
        ${reg && html`<label htmlFor="n">Your name</label><input id="n" name="name" type="text" autoComplete="name" required maxLength=${60} />`}
        <label htmlFor="e">Email</label><input id="e" name="email" type="email" autoComplete="email" required />
        <label htmlFor="p">Password${reg ? " (at least 8 characters)" : ""}</label><input id="p" name="password" type="password" autoComplete=${reg ? "new-password" : "current-password"} required />
        ${reg && html`<label>What can you build?</label><${Checks} name="skills" /><p class="small muted mt2">We use your skills and time zone (UTC${off >= 0 ? "+" : "-"}${Math.floor(Math.abs(off) / 60)}${Math.abs(off) % 60 ? ":" + String(Math.abs(off) % 60).padStart(2, "0") : ""}) to suggest teammates.</p>`}
        <button class="btn wide mt3" disabled=${busy}>${reg ? "Create account" : "Sign in"}</button>
      </form>
      <button class="btn ghost wide mt1" onClick=${demo} disabled=${busy}>Just looking? Try it as a demo user</button>
      <p class="switch">${reg ? "Already registered?" : "New here?"} <button type="button" onClick=${() => setReg(!reg)}>${reg ? "Sign in" : "Create an account"}</button></p>
    </section></div>`;
}

/* ---------- board ---------- */
function JoinPanel({ user, refresh }) {
  if (user.team_id) return html`<div class="panel pad"><h3>You are on a team</h3><p class="muted small mt1 mb2">Leave it first if you want to join another.</p><a class="btn ghost small linkbtn" href="#/team">Open my team</a></div>`;
  const submit = async (e) => {
    e.preventDefault(); const code = new FormData(e.target).get("code");
    const r = await act(() => api("/join", { method: "POST", body: { code } }), "You joined the team.", refresh);
    if (r.ok) location.hash = "#/team";
  };
  return html`<div class="panel pad"><h3>Have an invite code?</h3><form onSubmit=${submit}><label htmlFor="jc" class="small">Paste it here</label>
    <div class="field-row"><input id="jc" name="code" type="text" autoComplete="off" required /><button class="btn">Join</button></div></form></div>`;
}
function Board({ user, tick, refresh }) {
  const [limit, setLimit] = useState(30);
  const data = useLoad(() => api(`/board?limit=${limit}`), [tick, limit]);
  const stats = useLoad(() => api("/stats"), [tick]);
  const teams = data?.teams || [];
  return html`<div>
    <section class="hero" aria-label="About this page">
      <div><h1>Find your team before the clock runs out.</h1>
        <p>Every team below has open seats. Ask to join, or paste an invite code. Seats fill live and no seat is ever handed out twice.</p>
        <div class="legend"><span class="i"><span class="seat"></span>taken</span><span class="i"><span class="seat open"></span>open</span><span class="i"><span class="seat open last"></span>last seat</span></div></div>
      ${stats?.ok && html`<div class="stats"><div class="stat"><b>${stats.teams.toLocaleString()}</b><span>teams looking</span></div><div class="stat"><b>${stats.openSeats.toLocaleString()}</b><span>open seats</span></div></div>`}
    </section>
    <div class="cols"><section aria-labelledby="bh"><h2 id="bh" class="mb2">Teams with open seats</h2>
      <div class="panel">${teams.length ? html`<ul class="rows">${teams.map((t) => html`<li class="row" key=${t.id}>
        <div><h3>${t.name}</h3><p class="small muted">Led by ${t.leader_name}</p><${Chips} items=${t.needs} want=${true} /></div>
        <div class="seatcol"><${Seats} n=${t.member_count} max=${t.max_size} /><span class="small muted">${t.member_count} of ${t.max_size} seats taken</span></div>
        ${!user.team_id && html`<button class="btn small" aria-label=${"Ask to join " + t.name} onClick=${(e) => { e.currentTarget.disabled = true; act(() => api(`/teams/${t.id}/requests`, { method: "POST", body: {} }), "Request sent. The leader will see it live.", refresh); }}>Ask to join</button>`}</li>`)}</ul>`
        : html`<div class="empty"><strong>No open teams yet</strong>Be first: create a team from My team.</div>`}</div>
      ${teams.length >= limit && html`<p class="mt2"><button class="btn ghost" onClick=${() => setLimit(limit + 30)}>Show more teams</button></p>`}
    </section><aside class="side"><${JoinPanel} user=${user} refresh=${refresh} /></aside></div></div>`;
}

/* ---------- my team ---------- */
function CreateTeam({ user, refresh }) {
  const submit = async (e) => {
    e.preventDefault(); const d = new FormData(e.target);
    const r = await act(() => api("/teams", { method: "POST", body: { name: d.get("name"), maxSize: Number(d.get("maxSize")), needs: d.getAll("needs") } }), "Team created. Share your invite code.", refresh);
    if (r.ok) location.hash = "#/team";
  };
  return html`<div class="cols"><section class="panel pad" aria-labelledby="ch"><h2 id="ch">Start a team</h2><p class="muted mt1">You become the leader. You get an invite code, and you can accept or decline join requests.</p>
    <form onSubmit=${submit}><label htmlFor="tn">Team name</label><input id="tn" name="name" type="text" required minLength=${2} maxLength=${60} />
    <label htmlFor="ts">Seats in total</label><select id="ts" name="maxSize" defaultValue="4">${[2, 3, 4, 5, 6].map((n) => html`<option key=${n}>${n}</option>`)}</select>
    <label>Skills you are looking for</label><${Checks} name="needs" /><button class="btn mt3">Create team</button></form></section>
    <aside class="side"><${JoinPanel} user=${user} refresh=${refresh} /></aside></div>`;
}
function TeamPage({ user, tick, refresh }) {
  const d = useLoad(async () => {
    if (!user.team_id) return null;
    const r = await api("/teams/" + user.team_id);
    if (!r.ok) return { r };
    const open = r.team.member_count < r.team.max_size;
    const [log, sug] = await Promise.all([api(`/teams/${user.team_id}/audit`), r.isLeader && open ? api(`/teams/${user.team_id}/suggestions`) : null]);
    return { r, log, sug };
  }, [tick, user.team_id]);
  if (!user.team_id) return html`<${CreateTeam} user=${user} refresh=${refresh} />`;
  if (!d) return html`<p class="muted">Loading…</p>`;
  const { r, log, sug } = d;
  if (!r.ok) return html`<div class="panel empty"><strong>Team not found</strong>It may have been deleted.</div>`;
  const id = user.team_id, open = r.team.member_count < r.team.max_size;
  const need = r.team.min_size - r.team.member_count;
  const statusText = !r.team.looking ? "Finalized: closed to new members." : need > 0 ? `Needs ${need} more to be a valid team (minimum ${r.team.min_size}).` : "Valid size. Finalize when you are ready.";
  const finBtn = r.isLeader && r.team.looking ? html`<button class="btn" disabled=${need > 0} onClick=${() => act(() => api(`/teams/${id}/finalize`, { method: "POST" }), "Team finalized.", refresh)}>Finalize team</button>` : null;
  const copy = async () => { try { await navigator.clipboard.writeText(r.invite.code); toast("Code copied."); } catch { toast("Select the code and copy it.", true); } };
  return html`<div class="stack">
    <section class="head nomb"><div><h1 class="h1s">${r.team.name}</h1>
      <p class="muted mt1 mb2">${r.team.member_count} of ${r.team.max_size} seats taken. ${statusText}</p>
      <${Seats} n=${r.team.member_count} max=${r.team.max_size} big=${true} /><${Chips} items=${r.team.needs} want=${true} /></div>
      <div class="duo2">${finBtn}<button class="btn danger" onClick=${() => confirm("Leave this team? If you are the leader, leadership passes to the longest-standing member.") && act(() => api(`/teams/${id}/leave`, { method: "POST" }), "You left the team.", refresh)}>Leave team</button></div></section>
    <div class="cols"><div class="stack">
      <section class="panel pad"><h2>Members</h2><ul class="list">${r.members.map((m) => html`<li key=${m.id}><div><strong>${m.name}</strong>${m.id === r.team.leader_id && html`<span class="role">Leader</span>`}<${Chips} items=${m.skills} /></div>
        ${r.isLeader && m.id !== r.team.leader_id && html`<button class="btn danger small" aria-label=${"Remove " + m.name} onClick=${() => act(() => api(`/teams/${id}/members/${m.id}`, { method: "DELETE" }), "Removed.", refresh)}>Remove</button>`}</li>`)}</ul></section>
      ${r.isLeader && html`<section class="panel pad"><h2>Join requests</h2>${r.requests.length ? html`<ul class="list">${r.requests.map((q) => html`<li key=${q.id}><div><strong>${q.name}</strong> wants to join<${Chips} items=${q.skills} /></div>
        <span class="duo2"><button class="btn small" onClick=${() => act(() => api(`/requests/${q.id}/accept`, { method: "POST" }), "Accepted.", refresh)}>Accept</button><button class="btn ghost small" onClick=${() => act(() => api(`/requests/${q.id}/decline`, { method: "POST" }), "Declined.", refresh)}>Decline</button></span></li>`)}</ul>` : html`<p class="muted mt1">No one is waiting. New requests appear here live.</p>`}</section>`}
      ${r.isLeader && open && html`<section class="panel pad"><h2>People who would fit</h2><p class="small muted mt1">Score = 0.7 × skills + 0.3 × time zone. Skills reward what your team lacks and what you asked for.</p>
        ${sug?.suggestions?.length ? html`<ul class="list">${sug.suggestions.map((s) => html`<li key=${s.userId}><div class="grow"><strong>${s.name}</strong><${Chips} items=${s.skills} /><p class="small muted mt1">${s.why}</p></div>
          <div class="bars"><span>Skills</span><span class="bar2"><i style=${{ width: s.breakdown.skills * 100 + "%" }}></i></span><span>Time zone</span><span class="bar2"><i style=${{ width: s.breakdown.timezone * 100 + "%" }}></i></span></div>
          <div class="score" title="0.7 × skills + 0.3 × time zone">${s.score.toFixed(2)}</div></li>`)}</ul>` : html`<p class="muted mt1">No free people found.</p>`}</section>`}
    </div><aside class="side">
      ${r.isLeader && html`<div class="panel pad"><h3>Invite code</h3><span class="code">${r.invite.code}</span><p class="small muted">It ${until(r.invite.expires)}.</p>
        <p class="duo2 mt2"><button class="btn small" onClick=${copy}>Copy code</button><button class="btn ghost small" onClick=${() => act(() => api(`/teams/${id}/invite`, { method: "POST" }), "New code created.", refresh)}>Make a new code</button></p></div>`}
      <div class="panel pad"><h3>Activity</h3><ul class="list tl">${(log?.entries || []).map((e) => html`<li key=${e.id}><strong>${e.actor || "Someone"}</strong> ${e.action.replace(/_/g, " ")}<br /><span class="small muted">${ago(e.at)}</span></li>`)}</ul></div>
    </aside></div></div>`;
}

/* ---------- race arena ---------- */
function ArenaResult({ r }) {
  return html`<div aria-live="polite"><div class="dots" aria-hidden="true">${r.outcomes.map((w, i) => html`<span key=${i} class=${"dot " + (w ? "win" : "lose")} style=${{ animationDelay: i * 18 + "ms" }}></span>`)}</div>
    <${Seats} n=${r.finalSize} max=${r.maxSize} />
    <p class=${"verdict " + (r.overfilled ? "bad" : "good")}>${r.winners} of ${r.attempts} got in. The team ended with ${r.finalSize} of ${r.maxSize} seats${r.overfilled ? ", which breaks the rule." : "."}</p>
    <p class="small muted">${r.ms} ms${Object.keys(r.reasons).length ? " · " + Object.entries(r.reasons).map(([k, n]) => `${n} × ${k.replace(/_/g, " ")}`).join(", ") : ""}</p></div>`;
}
function Arena() {
  const [res, setRes] = useState({}), [busy, setBusy] = useState(null), [ver, setVer] = useState(null);
  async function run(mode) {
    setBusy(mode); const r = await api("/arena", { method: "POST", body: { mode } }); setBusy(null);
    if (r.winners === undefined) return toast(say(r), true);
    setRes((x) => ({ ...x, [mode]: r }));
  }
  const panel = (mode, title, text, label, cls) => html`<section class="panel pad" key=${mode} aria-labelledby=${"h-" + mode}><h2 id=${"h-" + mode}>${title}</h2><p class="muted mt1 mb2">${text}</p>
    <button class=${"btn " + cls} disabled=${!!busy} onClick=${() => run(mode)}>${busy === mode ? "Running…" : label}</button>${res[mode] && html`<${ArenaResult} r=${res[mode]} />`}</section>`;
  return html`<div><div class="head"><div><h1 class="h1s">Race Arena</h1><p class="muted measure">A team has 4 seats and 3 are taken. Fifty people try to grab the last seat at the same instant. Run the safe version, then the broken one, and compare. This is the whole point of the project: a seat is never given out twice.</p></div></div>
    <div class="duo">${panel("safe", "With the row lock", "Requests line up behind a database lock. One gets in; the rest hear “full”.", "Fire 50 joins", "")}${panel("unsafe", "Without the lock", "Each request checks the count, then inserts. They all see a free seat.", "Fire 50 broken joins", "danger")}</div>
    <section class="panel pad mt3"><h2>Check the data</h2><p class="muted mt1 mb2">Re-counts every team and person in the database. All five checks must show zero problems.</p>
    <button class="btn ghost" onClick=${async () => setVer((await api("/verify")).checks || [])}>Run integrity check</button>
    ${ver && html`<ul class="checklist">${ver.map((c) => html`<li key=${c.name}><span>${c.name}</span><span class=${c.violations ? "no" : "ok"}>${c.violations ? c.violations + " problems" : "0 problems"}</span></li>`)}</ul>`}</section></div>`;
}

/* ---------- app shell ---------- */
function App() {
  const [token, setToken] = useState(localStorage.getItem("tf_token")), [user, setUser] = useState(null);
  const [tick, setTick] = useState(0), [toasts, setToasts] = useState([]);
  const hash = useHash();
  pushToast = (msg, err) => { const id = Math.random(); setToasts((t) => [...t, { id, msg, err }]); setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4200); };
  const loadMe = useCallback(async () => {
    const r = await api("/me");
    if (r.ok) setUser(r.user); else { localStorage.removeItem("tf_token"); setToken(null); setUser(null); }
  }, []);
  const logout = useCallback(() => { localStorage.removeItem("tf_token"); setToken(null); setUser(null); }, []);
  const refresh = useCallback(async () => { await loadMe(); setTick((n) => n + 1); }, []);
  useEffect(() => { if (token) loadMe(); }, [token]);
  useEffect(() => { addEventListener("tf-logout", logout); return () => removeEventListener("tf-logout", logout); }, []);
  useEffect(() => { // live updates over server-sent events
    if (!token || !user) return;
    const topics = ["board", user.team_id ? "team:" + user.team_id : null].filter(Boolean).join(",");
    const es = new EventSource(`/api/stream?topics=${topics}&token=${encodeURIComponent(token)}`);
    let t; es.onmessage = () => { clearTimeout(t); t = setTimeout(refresh, 200); };
    return () => { es.close(); clearTimeout(t); };
  }, [token, user?.id, user?.team_id]);

  const toastEls = html`<div id="toast" role="status" aria-live="polite">${toasts.map((t) => html`<div key=${t.id} class=${"t" + (t.err ? " err" : "")}>${t.msg}</div>`)}</div>`;
  if (!token) return html`<${Auth} onLogin=${(t) => { localStorage.setItem("tf_token", t); setToken(t); location.hash = "#/board"; }} />${toastEls}`;
  if (!user) return html`<p class="muted loading">Loading…</p>${toastEls}`;
  const page = hash.replace("#/", "");
  const nav = [["board", "Board"], ["team", "My team"], ["arena", "Race Arena"]];
  return html`<header class="top"><div class="bar"><a class="brand" href="#/board"><${Chair} />TeamForge</a>
    <nav class="tabs" aria-label="Main">${nav.map(([k, l]) => html`<a key=${k} href=${"#/" + k} aria-current=${(page || "board") === k ? "page" : undefined}>${l}</a>`)}</nav>
    <div class="who"><span>${user.name}</span><button class="btn ghost small" onClick=${logout}>Sign out</button></div></div></header>
    <main id="view" tabIndex="-1">${page === "team" ? html`<${TeamPage} user=${user} tick=${tick} refresh=${refresh} />` : page === "arena" ? html`<${Arena} />` : html`<${Board} user=${user} tick=${tick} refresh=${refresh} />`}</main>${toastEls}`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
